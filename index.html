      productsList.innerHTML = "";
      if (list.length === 0) {
        productsList.innerHTML = "<p style='color: #94a3b8; grid-column: 1/-1; text-align: center;'>Aucun produit trouvé.</p>";
        return;
      }
      list.forEach(p => {
        const category = p.image === images.mouse ? "mouse"
          : p.image === images.pad ? "pad"
          : p.image === images.keyboard ? "keyboard"
          : p.image === images.headset ? "headset"
          : p.image === images.webcam ? "webcam"
          : p.image === images.monitor ? "monitor"
          : p.image === images.ssd ? "ssd"
          : p.image === images.ram ? "ram"
          : p.image === images.gpu ? "gpu"
          : "pc";
        productsList.innerHTML += `
          <div class="card category-${category}">
            <img src="${p.image}" alt="${p.nom}" onerror="this.src='https://via.placeholder.com/300x200?text=Produit'">
            <div class="card-body">
              <div class="card-title">${p.nom}</div>
              <div class="card-price">${p.prix} DH</div>
              <button class="add-btn" onclick="ajouterAuPanier(${p.id})">Ajouter au panier</button>
            </div>
          </div>
        `;
      });
    }

    // Afficher tous les produits au début
    afficherProduits(produits);

    // Fonction dyal la recherche
    function filtrerProduits() {
      const query = document.getElementById("search-input").value.toLowerCase();
      const filtered = produits.filter(p => p.nom.toLowerCase().includes(query));
      afficherProduits(filtered);
    }

    function trierProduits() {
      const category = document.getElementById("category-filter").value;
      const sort = document.getElementById("sort-filter").value;
      const query = document.getElementById("search-input").value.toLowerCase();

      let filtered = produits.filter(p =>
        (category === "all" || getProductCategory(p) === category)
        && p.nom.toLowerCase().includes(query)
      );

      filtered = [...filtered];
      if (sort === "name-asc") {
        filtered.sort((a, b) => a.nom.localeCompare(b.nom, "fr"));
      } else if (sort === "name-desc") {
        filtered.sort((a, b) => b.nom.localeCompare(a.nom, "fr"));
      } else if (sort === "price-asc") {
        filtered.sort((a, b) => a.prix - b.prix);
      } else if (sort === "price-desc") {
        filtered.sort((a, b) => b.prix - a.prix);
      } else {
        filtered.sort((a, b) =>
          categoryOrder[getProductCategory(a)] - categoryOrder[getProductCategory(b)]
          || a.nom.localeCompare(b.nom, "fr")
        );
      }

      document.getElementById("sort-summary").textContent = `${filtered.length} produit(s)`;
      afficherProduits(filtered);
    }

    function ajouterAuPanier(id) {
      const produit = produits.find(p => p.id === id);
      panier.push(produit);
      updateCart();
    }

    function supprimerDuPanier(index) {
      panier.splice(index, 1);
      updateCart();
    }

    function updateCart() {
      document.getElementById("cart-count").innerText = panier.length;
      const cartItems = document.getElementById("cart-items");
      cartItems.innerHTML = "";
      let total = 0;

      panier.forEach((item, index) => {
        total += item.prix;
        cartItems.innerHTML += `
          <div class="cart-item">
            <span>${item.nom} - <b>${item.prix} DH</b></span>
            <button class="remove-btn" onclick="supprimerDuPanier(${index})">X</button>
          </div>
        `;
      });

      if (panier.length === 0) cartItems.innerHTML = "<p style='color: #94a3b8;'>Le panier est vide.</p>";
      document.getElementById("cart-total").innerText = total;
    }

    function toggleCart() {
      const modal = document.getElementById("cart-modal");
      modal.style.display = modal.style.display === "flex" ? "none" : "flex";
    }

    function orderWhatsApp() {
      if (panier.length === 0) return alert("Panier khawi!");

      const customerName = document.getElementById("customer-name").value.trim();
      const customerPhone = document.getElementById("customer-phone").value.trim();
      const customerAddress = document.getElementById("customer-address").value.trim();

      if (!customerName || !customerPhone || !customerAddress) {
        return alert("عافاك عمر الاسم ورقم الهاتف والعنوان.");
      }

      let message = `Salam,sidi abduuh bghit n-commandi had les produits:\n\n`;
      let total = 0;
      panier.forEach(item => {
        message += `- ${item.nom} (${item.prix} DH)\n`;
        total += item.prix;
      });
      message += `\nTotal: ${total} DH\n`;
      message += `Nom: ${customerName}\nTéléphone: ${customerPhone}\nAdresse: ${customerAddress}`;
      
      window.open(`https://wa.me/${numeroWhatsApp}?text=${encodeURIComponent(message)}`, "_blank");
    }
  </script>
